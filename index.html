<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Pragya!</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Fredoka & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #fff1f2 0%, #fde68a 50%, #fbcfe8 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Fredoka', cursive;
        }

        /* Flat & Stationary Glass Card Sizing & Styling */
        .glass-card-static {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 25px 50px -12px rgba(244, 114, 182, 0.25);
            transform: none !important;
            animation: none !important;
        }

        /* Vibrant Birthday Text Gradient */
        .gradient-text {
            background: linear-gradient(135deg, #e11d48 0%, #d946ef 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Proportional Image Styling to prevent distortion */
        .gift-image-wrapper {
            width: 100%;
            max-height: 52vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 1.25rem;
            background-color: rgba(254, 242, 242, 0.6);
            border: 2px dashed rgba(244, 63, 94, 0.3);
        }

        .gift-image {
            max-width: 100%;
            max-height: 50vh;
            height: auto;
            width: auto;
            object-fit: contain;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        /* Smooth CSS Step Transitions */
        .step-panel {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .step-panel.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            position: relative;
        }

        /* Fullscreen Confetti Canvas Overlay */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative select-none">

    <!-- Confetti Overlay Canvas -->
    <canvas id="confetti-canvas"></canvas>

    <!-- Subtle Ambient Background Glows -->
    <div class="fixed top-10 left-10 w-72 h-72 bg-rose-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>
    <div class="fixed bottom-10 right-10 w-80 h-80 bg-amber-200 rounded-full mix-blend-multiply filter blur-3xl opacity-60"></div>

    <!-- Main Container - Strictly Centered Screen Card -->
    <main class="relative z-10 w-full max-w-xl mx-auto my-auto">
        <div class="glass-card-static rounded-3xl p-6 sm:p-10 text-center relative overflow-hidden transition-all duration-300 min-h-[420px] flex flex-col justify-center">

            <!-- STEP 0: Initial Screen -->
            <div id="step-0" class="step-panel active">
                <!-- Gift Icon Accent -->
                <div class="inline-flex items-center justify-center w-20 h-20 mb-6 rounded-2xl bg-gradient-to-tr from-rose-100 to-pink-100 text-rose-500 shadow-sm border border-rose-200/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v13m0-13V6a2 2 0 112 2h-2zm0 0V6a2 2 0 10-2 2h2zm0 13-4-3.5M12 21l4-3.5M3.75 9h16.5a1.5 1.5 0 011.5 1.5v2.25a1.5 1.5 0 01-1.5 1.5H3.75A1.5 1.5 0 012.25 12.75V10.5A1.5 1.5 0 013.75 9z" />
                    </svg>
                </div>

                <!-- Main Heading -->
                <h1 class="heading-font text-3xl sm:text-5xl font-bold tracking-tight mb-3 gradient-text leading-tight">
                    HAPPY BIRTHDAY PRAGYA
                </h1>

                <!-- Subheading -->
                <p class="text-lg sm:text-xl font-medium text-rose-900/80 mb-8 tracking-wide">
                    I am so grateful hehe
                </p>

                <!-- Initial CTA Button -->
                <button 
                    onclick="goToStep(1)"
                    class="px-8 py-4 bg-gradient-to-r from-rose-500 via-pink-500 to-purple-500 hover:from-rose-600 hover:via-pink-600 hover:to-purple-600 text-white font-bold text-lg rounded-full shadow-lg shadow-rose-500/25 hover:shadow-rose-500/40 transition-all duration-200 active:scale-95 flex items-center gap-3 cursor-pointer"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 11.25v8.25a1.5 1.5 0 01-1.5 1.5H4.5a1.5 1.5 0 01-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 109.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1114.625 7.5H12m0 0V21m-8.625-9.75h17.25" />
                    </svg>
                    <span>Redeem your gift card</span>
                </button>
            </div>

            <!-- STEP 1: First Image Screen -->
            <div id="step-1" class="step-panel">
                <div class="gift-image-wrapper mb-5 p-2">
                    <!-- MANUALLY REPLACE src="YOUR_IMAGE_URL_1.jpg" HERE -->
                    <img src="lilies.png" alt="Gift Image 1" class="gift-image">
                </div>

                <button 
                    onclick="goToStep(2)"
                    class="px-8 py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-base sm:text-lg rounded-full shadow-md shadow-rose-500/20 hover:shadow-rose-500/35 transition-all duration-200 active:scale-95 cursor-pointer flex items-center gap-2"
                >
                    <span>Next</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </button>
            </div>

            <!-- STEP 2: Second Image Screen -->
            <div id="step-2" class="step-panel">
                <div class="gift-image-wrapper mb-6 p-2">
                    <!-- MANUALLY REPLACE src="YOUR_IMAGE_URL_2.jpg" HERE -->
                    <img src="keema.jpg" alt="Gift Image 2" class="gift-image">
                </div>

                <p class="text-xl sm:text-2xl font-semibold text-rose-900/90 mb-6 tracking-wide">
                    and more...
                </p>

                <button 
                    onclick="goToStep(3)"
                    class="px-8 py-3.5 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-base sm:text-lg rounded-full shadow-md shadow-rose-500/20 hover:shadow-rose-500/35 transition-all duration-200 active:scale-95 cursor-pointer flex items-center gap-2"
                >
                    <span>Next</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
                    </svg>
                </button>
            </div>

            <!-- STEP 3: Final Image & Redemption Instructions Screen -->
            <div id="step-3" class="step-panel">
                <div class="gift-image-wrapper mb-5 p-2">
                    <!-- MANUALLY REPLACE src="YOUR_IMAGE_URL_3.jpg" HERE -->
                    <img src="picture.jpg" alt="Gift Image 3" class="gift-image">
                </div>

                <p class="text-base sm:text-lg font-semibold text-rose-950/90 leading-relaxed max-w-md bg-rose-50/80 p-4 rounded-2xl border border-rose-200/60 shadow-sm">
                    Redeem your gift card by contacting the <span class="gradient-text font-bold">Rijesh Shakya</span> from Kathmandu 🎂✨
                </p>
            </div>

        </div>
    </main>

    <script>
        // --- STEP NAVIGATION ENGINE ---
        function goToStep(stepNumber) {
            // Trigger festive celebratory confetti on each step transition!
            triggerConfettiBurst();

            // Hide all steps
            for (let i = 0; i <= 3; i++) {
                const stepEl = document.getElementById(`step-${i}`);
                if (stepEl) {
                    stepEl.classList.remove('active');
                }
            }

            // Show target step after a brief delay for smooth feel
            const targetStep = document.getElementById(`step-${stepNumber}`);
            if (targetStep) {
                targetStep.classList.add('active');
            }
        }

        // --- HIGH PERFORMANCE CONFETTI ENGINE ---
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const colors = ['#f43f5e', '#ec4899', '#d946ef', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b'];
        let particles = [];

        class ConfettiParticle {
            constructor(x, y) {
                this.x = x || width / 2;
                this.y = y || height / 2;
                this.size = Math.random() * 8 + 4;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                
                // Explosive outward velocity
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 4;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 3;
                
                this.gravity = 0.22;
                this.drag = 0.96;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 10 - 5;
                this.opacity = 1;
            }

            update() {
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.opacity -= 0.008;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = Math.max(0, this.opacity);
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function triggerConfettiBurst() {
            // Burst 90 festive particles
            for (let i = 0; i < 90; i++) {
                particles.push(new ConfettiParticle(width / 2, height / 2));
            }
        }

        function renderConfetti() {
            ctx.clearRect(0, 0, width, height);
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();
                
                if (p.opacity <= 0 || p.y > height + 20) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(renderConfetti);
        }

        // Start animation loop on window load
        window.onload = function() {
            renderConfetti();
        };
    </script>
</body>
</html>
